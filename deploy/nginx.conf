server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # 외부 호출은 Google Fonts(글꼴)뿐이다. 막혀도 맑은 고딕 등 시스템 글꼴로 표시된다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    expires -1;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ =404; }
}
