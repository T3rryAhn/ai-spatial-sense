<title>AI의 지능은 공간감각이다</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  try {
    const scheme = localStorage.getItem('starlight-theme');
    if (scheme === 'light' || scheme === 'dark') document.documentElement.dataset.theme = scheme;
  } catch { /* 저장소 접근이 제한되면 시스템 테마를 따른다. */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f7f5f0; --paper:#fffdf8; --ink:#1c1b19; --muted:#6d695f; --line:#e2ddd2; --grid:#e9e4d9;
  --fam:#0f8a7e; --obj:#4f55c9; --query:#e0603c; --doc:#b97c0c; --good:#2c8f4a; --bad:#d0453a;
  --hl:rgba(240,180,67,.38);
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --paper:#1a1d21; --ink:#ecebe7; --muted:#9b978e; --line:#2d3137; --grid:#23272c;
  --fam:#3cc4b4; --obj:#8e93f2; --query:#ff8a63; --doc:#f0b443; --good:#4fc274; --bad:#ff6b5e;
  --hl:rgba(240,180,67,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121417; --paper:#1a1d21; --ink:#ecebe7; --muted:#9b978e; --line:#2d3137; --grid:#23272c;
  --fam:#3cc4b4; --obj:#8e93f2; --query:#ff8a63; --doc:#f0b443; --good:#4fc274; --bad:#ff6b5e;
  --hl:rgba(240,180,67,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;position:relative;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}

/* 상단 진행 표시 */
.top{display:flex;align-items:flex-start;gap:20px;padding:16px 0 0;position:relative;z-index:2}
.brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;padding-top:1px}
.chapters{flex:1;display:flex;gap:6px;min-width:0}
.chap{flex:var(--n) 1 0;min-width:0;background:none;border:0;padding:0;text-align:left}
.chap .bar{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.chap .fill{display:block;height:100%;background:var(--ink);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.chap .lab{display:block;font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.chap.cur .lab{color:var(--ink);font-weight:600}

/* 본문: 왼쪽 문장, 오른쪽 무대 */
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:clamp(16px,4vw,64px);
  padding:0 clamp(0px,3vw,48px);min-height:0;position:relative;z-index:1}
.copy{max-width:560px;transition:opacity .18s,transform .18s}
.copy.out{opacity:0;transform:translateY(-10px)}
.kicker{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 0 14px}
.head{font-size:clamp(25px,3.1vw,42px);line-height:1.32;font-weight:700;letter-spacing:-.02em;margin:0}
.head em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%)}
.sub{font-size:clamp(15px,1.35vw,18px);line-height:1.65;color:var(--muted);margin:18px 0 0}
.act{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.act:empty{display:none}
.w{display:inline-block;opacity:0;transform:translateY(16px);animation:wIn .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*55ms)}
.late{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--n)*55ms + 250ms)}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.main.solo{grid-template-columns:1fr;justify-items:center;overflow-y:auto;padding-top:12px;padding-bottom:12px}
.main.solo .stage{display:none}
.main.solo .copy{text-align:center;max-width:860px}
.main.solo .head{font-size:clamp(32px,5.2vw,64px)}
.main.solo .act{justify-content:center}

/* 넓은 화면에서도 글과 그림을 한 시야에 둔다. 좁은 창·모바일 규칙은 유지한다. */
@media (min-width:1200px){
  .main:not(.solo){width:100%;max-width:1440px;margin-inline:auto;padding-inline:0;gap:24px}
  .main:not(.solo) .copy{justify-self:end;width:100%}
}
.study-tools{display:flex;gap:8px;white-space:nowrap;align-items:flex-start;height:0}
.study-tools a,.study-tools button{display:inline-flex;align-items:center;height:20px;font:inherit;font-size:12px;line-height:18px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 7px;text-decoration:none}
.scene-dialog{width:min(760px,calc(100% - 24px));max-height:85dvh;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);overflow:auto}
.scene-dialog::backdrop{background:rgb(0 0 0 / .55)}
.scene-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-20px;background:var(--bg);padding:10px 0}
.scene-dialog h2{font-size:20px;margin:0}
.scene-dialog h3{font-size:18px;margin:24px 0 12px}
.scene-dialog h4{font-size:14px;color:var(--muted);margin:16px 0 6px}
.scene-dialog ol{list-style:none;padding:0;margin:0}
.scene-dialog a{display:block;padding:9px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
.scene-dialog a:hover,.scene-dialog a[aria-current="step"]{background:var(--line)}
.scene-dialog a[aria-current="step"]{font-weight:700}
.scene-dialog a[aria-current="step"]::after{content:' · 현재 장면';color:var(--fam)}
:focus-visible{outline:2px solid var(--fam);outline-offset:3px}

.stage{position:relative;height:100%;min-height:0;display:grid;place-items:center}
#map{width:100%;height:100%;max-height:100%;display:block;transition:opacity .4s}
.panel{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s;overflow:auto;padding:8px 0}
.panel.show{opacity:1;pointer-events:auto}
.hud{position:absolute;left:0;bottom:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.7;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 8px)}
.hud.show{opacity:1}
.toast{position:absolute;top:4%;left:50%;transform:translate(-50%,8px);background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 하단 내비게이션 */
.nav{display:flex;align-items:center;gap:12px;padding:12px 0 max(16px,env(safe-area-inset-bottom));position:relative;z-index:2}
.nav .hint{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:44px;padding:0 20px;font-weight:600;font-size:15px;transition:transform .15s,opacity .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.round{width:44px;padding:0}
.btn.next{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.next.wait{background:var(--paper);color:var(--muted);border-color:var(--line)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:52px;text-align:right}

.cta{border:0;background:var(--ink);color:var(--bg);border-radius:999px;height:52px;padding:0 28px;font-weight:700;font-size:17px;transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:scale(.97)}
.cta.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 35%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.tiny{font-size:13px;color:var(--muted);flex-basis:100%;margin:6px 0 0}
.cnt{font-family:var(--mono);color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--ink);border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;transition:all .2s}
.chip.fam{--c:var(--fam)} .chip.obj{--c:var(--obj)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--bg)}
.qchip{display:inline-block;background:color-mix(in srgb,var(--query) 12%,var(--paper));border:1.5px solid var(--query);color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:600;font-size:16px}
.hint2{font-size:15px;font-weight:600;color:var(--muted);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
.slider{display:inline-flex;align-items:center;gap:12px;font-weight:600}
.slider input{width:min(240px,50vw);accent-color:var(--ink)}
.chip.qc{--c:var(--query);text-align:left}
.qmsg{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.55;animation:fadeUp .4s}
.qmsg .hk{margin-top:4px}
.vread{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:1.5em}
.link.att{stroke:var(--query);stroke-dasharray:none;stroke-width:3;opacity:.7}
.mat{line-height:1.5;margin:4px 0;white-space:pre}
/* 다이어그램 패널 */
.diag{width:min(100%,640px);height:auto;overflow:visible}
.dt{font-size:15px;fill:var(--ink);font-weight:500} .dt.b{font-weight:700;font-size:18px} .dt.m{fill:var(--muted);font-size:13px} .dt.s{font-size:14px;font-weight:600} .dt.red{fill:var(--bad);font-weight:700}
.dbox{fill:var(--paper);stroke:var(--line)} .drule{fill:color-mix(in srgb,var(--doc) 22%,var(--paper));stroke:var(--doc);stroke-width:2}
.darr{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:180;stroke-dashoffset:180;animation:draw .6s forwards;animation-delay:calc(var(--k)*120ms + 200ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge{stroke:var(--line);stroke-width:1}
.eflow{stroke-width:2;stroke-dasharray:10 300;stroke-dashoffset:0;opacity:.9;animation:flow 1.8s linear infinite}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-310}}
.node{opacity:0;animation:fadeUp .4s forwards;animation-delay:calc(var(--k)*250ms)}
.wgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;width:100%;font-family:var(--mono);font-size:12px;text-align:center}
.wgrid span{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 0;color:var(--muted)}
.wgrid span.flash{animation:flash .9s}
@keyframes flash{0%{background:var(--hl);color:var(--ink);border-color:var(--doc)}}
.pcount{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.pcount span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.pcount b{color:var(--ink);margin-right:4px}
.stack{position:relative;display:grid;gap:8px;width:min(100%,420px);padding-left:28px}
.layer{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--obj);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:baseline;opacity:0;animation:fadeUp .4s forwards;animation-delay:calc((6 - var(--k))*150ms)}
.layer span{font-size:13px;color:var(--muted)} .layer.dots{border:0;background:none;justify-content:center;color:var(--muted);padding:0}
.sin,.sout{font-size:14px;text-align:center;font-family:var(--mono)} .sin{color:var(--query)} .sout{color:var(--fam);font-family:var(--sans);font-weight:600}
.token{position:absolute;left:6px;bottom:8px;width:14px;height:14px;border-radius:50%;background:var(--query);animation:rise 3.2s cubic-bezier(.5,0,.5,1) infinite 1s}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1;background:var(--fam)}100%{transform:translateY(calc(-1 * var(--h,300px)));opacity:0;background:var(--fam)}}
.mm{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:20px}
.mbr{display:grid;gap:6px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);padding:6px 10px;border-radius:6px}
.mr{display:grid;grid-template-columns:repeat(3,3.2em);text-align:center;border-radius:6px;animation:hlrow 3.6s infinite;animation-delay:calc(var(--k)*1.2s)}
.mbr.col span{display:block;text-align:center;min-width:3em;padding:0 0}
.mbr.res span{animation:hlrow 3.6s infinite;animation-delay:calc(var(--k)*1.2s);border-radius:6px}
@keyframes hlrow{0%,33%{background:var(--hl)}34%,100%{background:transparent}}
.op{color:var(--muted)}
.mf{margin-top:16px;font-family:var(--mono);font-size:14px;color:var(--muted);display:grid;gap:4px;text-align:center}
.mf div{animation:hltext 3.6s infinite;animation-delay:calc(var(--k)*1.2s)}
@keyframes hltext{0%,33%{color:var(--ink)}34%,100%{color:var(--muted)}}
.rwrap{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%}
.rcol{display:grid;gap:8px;justify-items:center;width:min(100%,250px)}
.rh2{font-weight:600;font-size:14px;text-align:center} .rh2 small{color:var(--muted);font-weight:400}
.race{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;width:100%;aspect-ratio:1}
.race i{background:var(--grid);border-radius:2px;transition:background .15s}
.race i.on{background:var(--fam)}
#rc i.on{background:var(--obj)}
.rt{font-family:var(--mono);font-size:14px}
.vr{display:grid;gap:12px;width:min(100%,520px)}
.vbox{background:var(--paper);border:1.5px solid var(--fam);border-radius:14px;padding:12px}
.vbox.ram{border-color:var(--line)} .vbox.ram.over{border-color:var(--bad)}
.vh{font-size:13px;font-weight:600;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;min-height:24px}
.slots i{aspect-ratio:2/1;border-radius:4px}
.slots .empty{border:1px dashed var(--line)}
.slots .blk{background:var(--fam);animation:pop .3s backwards;animation-delay:calc(var(--d)*1ms)}
.slots .blk.bad{background:var(--bad)}
.more{font-family:var(--mono);font-size:13px;color:var(--bad);align-self:center}
.vres{font-size:15px;line-height:1.5} .vres.ok{color:var(--good)} .vres.no{color:var(--bad)} .vres b{color:var(--ink)}
.vnote{font-size:12px;color:var(--muted);margin:0}
.vctl{display:grid;gap:6px}
.chips.sm .chip{padding:6px 12px;font-size:14px}
.kctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;flex-basis:100%}
.cowr{display:grid;gap:14px;width:min(100%,460px);justify-items:center}
.cowr .card{width:100%}
.rl{padding:6px 0;border-bottom:1px solid var(--line);opacity:0;animation:fadeUp .4s forwards;animation-delay:calc(var(--k)*250ms + 500ms)}
.exs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ex{background:color-mix(in srgb,var(--bad) 12%,var(--paper));border:1px solid var(--bad);color:var(--bad);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;opacity:0;animation:popin .4s forwards;animation-delay:calc(var(--k)*350ms + 1.8s)}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.rline{stroke:var(--obj);opacity:.45;stroke-dasharray:300;stroke-dashoffset:300;animation:draw .7s forwards;animation-delay:calc(var(--k)*150ms + 200ms)}
.rnode{opacity:0;animation:fadeUp .4s forwards;animation-delay:calc(var(--k)*150ms + 500ms)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
.switch input{width:20px;height:20px;accent-color:var(--doc)}

/* 무대 SVG */
svg text{font-family:var(--sans)}
.lab{font-size:16px;font-weight:600;fill:var(--ink)}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.axis{stroke:var(--muted);stroke-width:1.3}
.ring0{fill:none;stroke:var(--grid);stroke-width:1.3}
.axl{font-family:var(--mono);font-size:13px;fill:var(--muted)}
.pt.fam{color:var(--fam)} .pt.obj{color:var(--obj)} .pt.doc{color:var(--doc)} .pt.query{color:var(--query)}
.pt.query .lab{fill:var(--query)}
.pt .dot{fill:currentColor}
.pt .ring{fill:none;stroke:currentColor;stroke-width:2.5}
.pt .ring.bad{stroke:var(--bad);stroke-dasharray:4 4}
.crd{font-family:var(--mono);font-size:12.5px;fill:var(--muted)}
.pt .grab{fill:currentColor;opacity:.14;animation:breathe 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.35);opacity:.06}}
#map.interactive{touch-action:none;cursor:grab}
#map.interactive.tap{cursor:crosshair}
#map.dragging{cursor:grabbing}
.ray{stroke-width:2.6;stroke-linecap:round}
.ray.fam{stroke:var(--fam)} .ray.obj{stroke:var(--obj)} .ray.doc{stroke:var(--doc)} .ray.query{stroke:var(--query)}
.link{stroke-width:2.6;stroke-dasharray:7 7}
.link.bad{stroke:var(--bad)} .link.good{stroke:var(--good)}
.linkl{font-size:15px;font-weight:700}
.linkl.bad{fill:var(--bad)} .linkl.good{fill:var(--good)}
.arc{fill:none;stroke:var(--ink);stroke-width:2}
.arcl{font-family:var(--mono);font-size:14px;fill:var(--ink);font-weight:500}

/* HUD 내용 */
.lrow{display:flex;gap:10px;align-items:baseline}
.lrow b{min-width:3em}
.lrow.fam b{color:var(--fam)} .lrow.obj b{color:var(--obj)}
.lrow .arr{color:var(--muted)}
.hk{color:var(--muted);font-size:12px}
.ok{color:var(--good);font-weight:600}
.rank{min-width:260px}
.rh{font-size:12px;color:var(--muted);margin-bottom:4px}
.rr{display:grid;grid-template-columns:9em 1fr 3.4em;gap:10px;align-items:center;font-size:14px;line-height:1.3;padding:4px 0}
.rr b .ck{color:var(--doc);margin-right:4px}
.rr .rb{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.rr .rb i{display:block;height:100%;background:var(--muted);border-radius:3px;transition:width .4s}
.rr.top .rb i{background:var(--doc)} .rr.topw .rb i{background:var(--ink)}
.rr.top b,.rr.topw b{font-weight:700}
.rr.miss{color:var(--bad)} .rr.miss .rb i{background:var(--bad)}
.rr .mono{text-align:right}
.rr b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 패널 내용 */
.cards{display:grid;gap:12px;width:min(100%,520px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;opacity:0;animation:fadeUp .5s forwards;animation-delay:calc(var(--k)*420ms + 200ms)}
.card h3{margin:0 0 4px;font-size:18px}
.card h3 small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:15px}
.card .ai{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0;opacity:0;animation:fadeUp .5s forwards;animation-delay:1.6s}
.vwrap{display:grid;gap:10px;justify-items:center;width:min(100%,520px)}
.vg{display:grid;grid-template-columns:repeat(32,1fr);gap:1.5px;width:100%;aspect-ratio:32/24}
.vg i{background:var(--fam);opacity:var(--a);border-radius:1px;animation:pop .35s backwards;animation-delay:calc(var(--d)*1ms)}
.vg i.n{background:var(--obj)}
@keyframes pop{from{transform:scale(0)}}

function focusPair(a, b) {
  return { axes: 1, pts: pts(WORDS, 'tgt', Object.fromEntries(WORDS.map(id => [id, { op: id === a || id === b ? 1 : 0.25 }]))),
    rays: { [a]: 1, [b]: 1 }, arc: [a, b] };
}
function ragScene(q, useKw, missId, n = 3) {
  const top = topIds(q, useKw, n);
  const ex = Object.fromEntries(DOCS.map(id => [id, { op: top.includes(id) || id === missId ? 1 : 0.35, hl: top.includes(id) ? 1 : 0, bad: id === missId }]));
  return { axes: 1, pts: { ...pts(DOCS, 'tgt', ex), [q]: { at: at(q, D[q].tgt) } }, rays: Object.fromEntries([q, ...top].map(id => [id, 1])) };
}
function quizMsg() {
  const c = cosSim(guess, EXTRA.baby.tgt);
  const m = c >= 0.9 ? '🎯 거의 정확해요! ‘아기’는 엄마·아빠·가족 곁에 놓입니다.'
    : c >= 0.6 ? '👍 방향이 비슷해요. 정답은 가족 쪽에 조금 더 가깝습니다.'
    : '🤔 조금 멀어요. ‘아기’는 엄마·아빠·가족과 늘 같이 쓰이니까 그쪽에 놓입니다.';
  return `<div class="qmsg"><div>${m}</div><div class="hk">내 답과 정답의 유사도 <b class="mono">${f2(c)}</b></div></div>`;
}

function refreshAct() { $('#act').innerHTML = beat.act ? beat.act() : ''; }

/* ---------- 규칙 vs 관계: ‘소’ ---------- */
function cowRule() {
  const rules = ['다리가 4개다', '뿔이 있다', '풀을 먹는다', '‘음메’ 하고 운다'], ex = ['뿔 없는 소는?', '다리를 다친 소는?', '그림 속 소는?', '송아지는?'];
  return `<div class="cowr"><div class="card" style="--k:0"><h3>규칙으로 정의한 ‘소’</h3>
    ${rules.map((r, i) => `<div class="rl" style="--k:${i}">✓ ${r}</div>`).join('')}</div>
    <div class="exs">${ex.map((e, i) => `<span class="ex" style="--k:${i}">${e}</span>`).join('')}</div>
    <p class="note" style="animation-delay:3.4s">예외마다 규칙을 또 적어야 합니다. 끝이 없습니다.</p></div>`;
}
function cowRel() {
  const nb = [['우유', 0.95], ['풀', 0.85], ['농장', 0.8], ['송아지', 0.9], ['음메', 0.7], ['고기', 0.6], ['말(馬)', 0.45], ['트랙터', 0.35]];
  const c = [300, 175];
  const el = nb.map(([w, s], i) => { const a = i / nb.length * Math.PI * 2 - Math.PI / 2, r = 70 + (1 - s) * 110, x = c[0] + Math.cos(a) * r * 1.5, y = c[1] + Math.sin(a) * r;

let last = performance.now(), hudHtml = '';
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (beat.tick) beat.tick(t, dt);
  const a = reduce ? 1 : 1 - Math.exp(-dt * 5.5);
  let moving = false;
  for (const k in ts) {
    if (cs[k] === undefined) cs[k] = k.endsWith('.op') || k.startsWith('ray.') || k.startsWith('line.') || k.endsWith('.hl') ? 0 : ts[k];
    const d = ts[k] - cs[k]; if (Math.abs(d) > 1e-4) { cs[k] += d * a; moving = true; } else cs[k] = ts[k];
  }
  if (moving || beat.tick || beat.draw) render(t);
  if (beat.hud) { const h = beat.hud(); if (h !== hudHtml) { hud.innerHTML = h; hudHtml = h; } }
  requestAnimationFrame(frame);
}

/* ---------- 진행 ---------- */
const chapters = $('#chapters');
let barPart = -1;
function buildBar(p) {
  if (p === barPart) return; barPart = p;
  chapters.innerHTML = CH.map((c, i) => [c, i]).filter(([c]) => p && c.p === p).map(([c, i]) => `<button class="chap" data-ch="${i}" style="--n:${BEATS.filter(b => b.ch === i).length}"><span class="bar"><span class="fill"></span></span><span class="lab">${c.t}</span></button>`).join('');
  $('.brand').textContent = p ? `${PARTS[p][0]} · ${PARTS[p][1]}` : 'AI의 지능은 공간감각이다';
}
function kickerOf(b) {
  const c = CH[b.ch]; if (!c.p) return '';
  const nums = CH.filter(x => x.p === c.p && x.t !== '시작' && x.t !== '마무리'), n = nums.indexOf(c);
  return n < 0 ? `${PARTS[c.p][0]} · ${c.t}` : `${PARTS[c.p][0]} · ${String(n + 1).padStart(2, '0')} ${c.t}`;
}
const fmt = s => s.split(' ').map((w, i) => `<span class="w" style="--i:${i}">${w.replace(/\*(.+?)\*/g, '<em>$1</em>')}</span>`).join(' ');

function go(i, first) {
  i = Math.max(0, Math.min(BEATS.length - 1, i));
  timers.forEach(clearTimeout); timers = [];
  idx = i; beat = BEATS[i]; t0 = performance.now() / 1000; over = {}; drag = null;
  document.querySelectorAll('[data-scene]').forEach(link => {
    if (+link.dataset.scene === idx) link.setAttribute('aria-current', 'step');
    else link.removeAttribute('aria-current');
  });
  if (beat.enter) beat.enter();
  applyScene();
  map.classList.toggle('interactive', !!(beat.drag || beat.rotate3d || beat.onTap));
  map.classList.toggle('tap', !!beat.onTap);

  const copy = $('#copy');
  copy.classList.add('out');
  setTimeout(() => {
    const n = beat.head.split(' ').length;
    $('#kicker').textContent = beat.kicker || kickerOf(beat);
    $('#head').innerHTML = fmt(beat.head);
    const sub = $('#sub'); sub.textContent = beat.sub || ''; sub.className = 'sub late'; sub.style.setProperty('--n', n); sub.hidden = !beat.sub;
    const act = $('#act'); act.innerHTML = beat.act ? beat.act() : ''; act.className = 'act late'; act.style.setProperty('--n', n + 3);
    $('#main').classList.toggle('solo', !!beat.solo);
    $('#dust').classList.toggle('show', !!beat.solo);
    copy.classList.remove('out');
  }, first ? 0 : 190);

  panel.classList.remove('show');
  const me = beat;
  setTimeout(() => { if (me === beat && me.panel) { panel.innerHTML = me.panel(); panel.classList.add('show'); } }, first ? 0 : 260);
  if (!beat.panel) setTimeout(() => { if (me === beat) panel.innerHTML = ''; }, 400);
  hud.classList.toggle('show', !!beat.hud); hudHtml = ''; if (!beat.hud) hud.innerHTML = '';
  updateQbar();

  buildBar(CH[beat.ch].p);
  document.querySelectorAll('.chap').forEach(el => {
    const c = +el.dataset.ch, list = BEATS.map((b, k) => [b, k]).filter(([b]) => b.ch === c), pos = list.findIndex(([, k]) => k === idx);
    const done = list[0][1] > idx ? 0 : list[list.length - 1][1] < idx ? 1 : (pos + 1) / list.length;
    el.querySelector('.fill').style.width = done * 100 + '%'; el.classList.toggle('cur', c === beat.ch);
  });
  if (chapters.scrollWidth > chapters.clientWidth) {
    chapters.querySelector('.cur')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  $('#count').textContent = `${idx + 1} / ${BEATS.length}`;
  $('#prev').disabled = idx === 0;
  $('#next').hidden = idx === BEATS.length - 1;
  updateGate();
  try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) {}
}
function updateGate() {
  const locked = beat.gate && !beat.gate();
  const nb = $('#next'); nb.disabled = !!locked; nb.classList.toggle('wait', !!locked);
  $('#hint').textContent = locked ? '위 버튼을 눌러야 넘어갈 수 있어요' : '→ 키 · 스페이스로 넘기기';
}
const next = () => { if (!(beat.gate && !beat.gate())) go(idx + 1); };
const prev = () => go(idx - 1);

/* ---------- 입력 ---------- */
const sceneDialog = $('#scene-dialog');
const sceneList = (ch) => '<ol>' + BEATS.map((b, i) => b.ch === ch
  ? `<li><a href="#${i + 1}" data-scene="${i}">${i + 1}. ${b.head.replace(/\*/g, '')}</a></li>` : '').join('') + '</ol>';
$('#scene-links').innerHTML = sceneList(0) + Object.entries(PARTS).map(([p, info]) =>
  `<h3>${info[0]} · ${info[1]}</h3>` + CH.map((c, ch) => c.p === +p
    ? `<h4>${c.t}</h4>${sceneList(ch)}` : '').join('')).join('');
$('#open-scenes').onclick = () => {
  sceneDialog.showModal();
  sceneDialog.querySelector('[aria-current="step"]')?.scrollIntoView({ block: 'center' });
};
$('#close-scenes').onclick = () => sceneDialog.close();
$('#scene-links').onclick = e => {
  const link = e.target.closest('[data-scene]');
  if (!link) return;
  e.preventDefault();
  sceneDialog.close();
  jumpTo(+link.dataset.scene);
};
function jumpTo(i) {
  if (i > BEATS.findIndex(b => b.gate)) learnT = 1;
  if (i > BEATS.findIndex(b => b.ch === 4 && b.enter)) objT = 1;
  if (i > BEATS.findIndex(b => b.onTap)) guess = [0.3, 0.6];
  if (i > BEATS.findIndex(b => b.ch === 10 && b.gate)) nnStep = 3;
  go(i, true);
}
window.addEventListener('hashchange', () => {
  if (/^#[1-9]\d*$/.test(location.hash)) jumpTo(Number(location.hash.slice(1)) - 1);
});
$('#next').onclick = next; $('#prev').onclick = prev;
chapters.onclick = e => { const b = e.target.closest('.chap'); if (b) go(BEATS.findIndex(x => x.ch === +b.dataset.ch)); };
const toast = $('#toast');
$('#act').addEventListener('click', e => {
  const t = e.target.closest('button,input'); if (!t) return;
  if (t.hasAttribute('data-go')) next();
  if (t.dataset.jump !== undefined) { const c = +t.dataset.jump; go(c === 0 ? 0 : BEATS.findIndex(b => b.ch === c)); return; }
  if (t.hasAttribute('data-restart')) { learnT = 0; objT = 0; base = 'fam'; guess = null; go(0); }
  if (t.hasAttribute('data-clap') && learnT < 0.99) {
    const n = Math.round(learnT * 3); learnT = Math.min(1, (n + 1) / 3);
    toast.textContent = '👏 “맞아!”'; toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 1200);
    if (learnT > 0.99) { $('#next').classList.add('pulse'); setTimeout(() => $('#next').classList.remove('pulse'), 2000); }
    applyScene(); refreshAct(); updateGate();
  }
  if (t.hasAttribute('data-clapreset')) { learnT = 0; applyScene(); refreshAct(); updateGate(); }
  if (t.dataset.base) { base = t.dataset.base; document.querySelectorAll('[data-base]').forEach(c => c.classList.toggle('on', c.dataset.base === base)); applyScene(); }
  if (t.hasAttribute('data-hybrid')) { hybrid = t.checked; applyScene(); }
  if (t.dataset.q) { ragQ = t.dataset.q; document.querySelectorAll('[data-q]').forEach(c => c.classList.toggle('on', c.dataset.q === ragQ)); applyScene(); updateQbar(); }
});
$('#act').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-nn') && nnStep < 3) { nnStep++; applyScene(); refreshAct(); updateGate(); }
  if (t.dataset.ctx) { ctx = t.dataset.ctx; applyScene(); document.querySelectorAll('[data-ctx]').forEach(c => c.classList.toggle('on', c.dataset.ctx === ctx)); }
  if (t.dataset.k) { topK = +t.dataset.k; applyScene(); refreshAct(); }
  if (t.hasAttribute('data-race')) { timers.forEach(clearTimeout); timers = []; runRace(); }
  if (t.dataset.vm) { const [k, v] = t.dataset.vm.split(':'); vm[k] = +v; refreshAct(); panel.innerHTML = vramPanel(); }
});

/* 지도 위 직접 조작: 점 끌기 · 3D 돌리기 · 눌러서 찍기 */
let drag = null;
function toMath(e) {
  const pt = map.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(map.getScreenCTM().inverse());
  return [(p.x - C) / R, (C - p.y) / R];
}
map.addEventListener('pointerdown', e => {
  if (!beat || beat.map === false) return;
  if (beat.rotate3d) { drag = { kind: '3d', sx: e.clientX, sy: e.clientY, yaw, pitch }; spin = false; try { map.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const m = toMath(e);
  if (beat.drag) {
    let best = null, bd = 0.16;
    for (const id of beat.drag) {
      if ((cs[id + '.op'] || 0) < 0.5) continue;
      const d = Math.hypot(pos(id)[0] - m[0], pos(id)[1] - m[1]); if (d < bd) { bd = d; best = id; }
    }
    if (best) { drag = { kind: 'pt', id: best, off: [pos(best)[0] - m[0], pos(best)[1] - m[1]] }; try { map.setPointerCapture(e.pointerId); } catch (_) {} map.classList.add('dragging'); return; }
  }
  if (beat.onTap) beat.onTap(m);
});
map.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.kind === '3d') {
    yaw = drag.yaw + (e.clientX - drag.sx) * 0.01;
    pitch = Math.max(-1.3, Math.min(1.3, drag.pitch + (e.clientY - drag.sy) * 0.01));
    return;
  }
  const m = toMath(e), id = drag.id;
  let p = [m[0] + drag.off[0], m[1] + drag.off[1]];
  p = ENT[id].emoji ? [Math.max(-1.25, Math.min(1.25, p[0])), Math.max(-1.05, Math.min(1.05, p[1]))] : clampR(p, 1.15);
  if (!ENT[id].emoji && Math.hypot(...p) < 0.05) p = [0.05, 0];   // 원점에선 방향이 없으니 살짝 비켜둠
  over[id] = p; applyScene();
  cs[id + '.x'] = ts[id + '.x'] = p[0]; cs[id + '.y'] = ts[id + '.y'] = p[1];
  render(performance.now() / 1000);
});
const endDrag = () => { drag = null; map.classList.remove('dragging'); };
map.addEventListener('pointerup', endDrag); map.addEventListener('pointercancel', endDrag);
panel.addEventListener('pointerover', e => {
  const c = e.target.closest('.vg i'); if (!c) return;
  const r = c.closest('.vwrap').querySelector('.vread'); if (r) r.textContent = `${c.dataset.i}번째 숫자 = ${c.dataset.v}`;
});
document.addEventListener('keydown', e => {
  if (sceneDialog.open) return;
  if (e.target.closest && e.target.closest('button,input,a,select,textarea') && (e.key === ' ' || e.key === 'Enter')) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
});
let tx = null, ty = null;
document.addEventListener('touchstart', e => {
  if (sceneDialog.open) { tx = null; return; }
  if (e.target.closest && (e.target.closest('#map.interactive') || e.target.closest('input'))) { tx = null; return; }   // 지도를 조작할 땐 넘기지 않음
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev();
}, { passive: true });

/* 시작·끝 화면 배경 점 */
const cols = ['var(--fam)', 'var(--obj)', 'var(--doc)', 'var(--query)'];
$('#dust').innerHTML = Array.from({ length: 34 }, (_, i) => {
  const r = rng(100 + i); return `<span style="left:${r() * 100}%;top:${r() * 100}%;--s:${6 + r() * 14}px;--c:${cols[i % 4]};--t:${6 + r() * 8}s;--dx:${(r() - 0.5) * 120}px;--dy:${(r() - 0.5) * 120}px"></span>`;
}).join('');

/* 시작: #번호로 바로 이동 가능 (발표용) */
let startAt = 0;
try { const h = parseInt(location.hash.slice(1), 10); if (h > 0) startAt = h - 1; } catch (e) {}
jumpTo(startAt);
requestAnimationFrame(frame);
})();
</script>
